name: Build levipack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout preloader-android SDK (0.2.2)
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/preloader-android
          ref: 0.2.2
          path: preloader-android

      - name: Install toolchain
        run: |
          pip install cmake ninja
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
          unzip -q ndk.zip && rm ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r28b" >> "$GITHUB_ENV"

      - name: Build packages
        run: ./scripts/build.sh all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: levi-create-levipacks
          path: dist/*.levipack

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.levipack
